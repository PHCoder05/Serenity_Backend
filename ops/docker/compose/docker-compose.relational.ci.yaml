services:
  postgres:
    image: postgres:17.9-alpine
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  maildev:
    build:
      context: ../../../
      dockerfile: ops/docker/images/maildev.Dockerfile
    expose:
      - 1080
      - 1025

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   expose:
  #     - 6379

  api:
    build:
      context: ../../../
      dockerfile: ops/docker/images/relational.e2e.Dockerfile
    env_file:
      - ../../../env-example-relational
